# Builds the general Agent base image, the `basic` stage of agents/base-ubuntu, whose stages `agentctl init` copies into
# the Dockerfiles it writes.
# Pull requests only build it; main, including a manual run on main, also publishes it to GHCR as `latest` and
# `sha-<commit>`. Nothing pulls it yet; see the TODO at the top of agents/base-ubuntu/Dockerfile.
name: agentctl base image

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]
    paths:
      - agents/base-ubuntu/**
      - .github/workflows/agentctl-base-image.yml
  push:
    branches:
      - main
    paths:
      - agents/base-ubuntu/**
      - .github/workflows/agentctl-base-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: agentctl-base-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CONTEXT: agents/base-ubuntu
  REGISTRY: ghcr.io/digdir/digdir-agents

jobs:
  build:
    if: ${{ github.event_name != 'pull_request' || (github.event.action != 'closed' && !github.event.pull_request.draft) }}
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            agents/base-ubuntu

      - name: Set up Docker
        uses: docker/setup-docker-action@e43656e248c0bd0647d3f5c195d116aacf6fcaf4 # v4.7.0
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Login to GHCR
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Build and publish image
        env:
          PUBLISH: ${{ github.ref == 'refs/heads/main' }}
        run: |
          set -eu

          repository="${REGISTRY}/agentctl-base-ubuntu"
          build() {
            docker buildx build \
              --provenance=false \
              --sbom=false \
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --cache-from "type=registry,ref=${repository}:buildcache" \
              --platform linux/amd64,linux/arm64 \
              "$@" \
              "${CONTEXT}"
          }

          # Every stage is checked, since `agentctl init` copies each one into the Dockerfiles it
          # writes; only `basic` is published.
          build --target desktop
          if [ "${PUBLISH}" = "true" ]; then
            build --target basic \
              --tag "${repository}:sha-${GITHUB_SHA::10}" \
              --tag "${repository}:latest" \
              --push \
              --cache-to "type=registry,ref=${repository}:buildcache,mode=max,image-manifest=true"
          fi
